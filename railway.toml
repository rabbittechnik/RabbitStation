# Monorepo (Repo-Root): Railpack führt bereits `npm ci` im Install-Schritt aus.
[build]
builder = "railpack"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start -w server"
healthcheckPath = "/api/health"
# Build baut Client + Server; Server kann optional client/dist mit ausliefern (SERVE_CLIENT_STATIC=1)
healthcheckTimeout = 300
