# Server-Service: In Railway „Root Directory“ = server setzen
# oder Config-as-Code-Pfad: server/railway.toml
[build]
builder = "railpack"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
# Empfohlen: CONTROL_CENTER_API_TOKEN + ggf. SERVE_CLIENT_STATIC=1 wenn Monorepo-Build client+server
healthcheckTimeout = 300
